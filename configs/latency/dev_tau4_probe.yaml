# Dev mini-probe: m_tau4 at the cliff zone (L2/L5) — completes the tau
# selection evidence before freezing the formal spec.
experiment_id: latency_dev_tau4_v1
checkpoint: runs/train_100pct_formal/checkpoints/010000/pretrained_model
device: cuda
tasks: [goal_bowl_stove]
max_ticks: 300
methods:
  - name: m_tau4
    kind: m_feedback
    feedback:
      diff_threshold_high: 4.0
      diff_threshold_low: 2.0
      min_interval_ticks: 2
      max_interval_ticks: 40
latency_conditions:
  - name: L2
    obs_delay_ticks: 0
    inference_delay_ticks: 2
  - name: L5
    obs_delay_ticks: 0
    inference_delay_ticks: 5
inits:
  start_index: 0
  count: 5
  start_seed: 42
video:
  record: false
