# Stage-2 pilot: 1 task x {B1, M} x 2 latency levels x 5 dev inits = 20 episodes.
# Purpose: debug the closed loop and estimate cost. NOT a formal result.
# Latency levels are initial examples; final levels are frozen after the
# timing measurement (docs/latency/environment_audit.md).
experiment_id: latency_pilot_v1
checkpoint: runs/train_100pct_formal/checkpoints/010000/pretrained_model
device: cuda
tasks: [goal_bowl_stove]
max_ticks: 300
methods:
  - name: b1_k10
    kind: b1_fixed_period
    period_ticks: 10
  - name: m
    kind: m_feedback
    feedback:
      diff_threshold_high: 4.0
      diff_threshold_low: 2.0
      min_interval_ticks: 2
      max_interval_ticks: 10
latency_conditions:
  - name: L20
    obs_delay_ticks: 0
    inference_delay_ticks: 20
  - name: L40
    obs_delay_ticks: 0
    inference_delay_ticks: 40
inits:
  start_index: 0
  count: 5
  start_seed: 42
video:
  record: true
  trials_per_condition: 1
