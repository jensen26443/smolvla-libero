# Interface validation: unified runner in R0 mode (every-step replan, zero
# latency) must succeed near the official-path anchor (5/5 on this task).
# 4 dev inits; semantic equivalence anchor, not a formal result.
experiment_id: latency_r0_unified_check
checkpoint: runs/train_100pct_formal/checkpoints/010000/pretrained_model
device: cuda
tasks: [goal_bowl_stove]
max_ticks: 300
methods:
  - name: r0
    kind: r0_every_step
latency_conditions:
  - name: near_zero
    obs_delay_ticks: 0
    inference_delay_ticks: 0
inits:
  start_index: 0
  count: 4
  start_seed: 42
video:
  record: true
  trials_per_condition: 1
